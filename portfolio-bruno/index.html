<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bruno · Editor de vídeo</title>
<meta name="description" content="Portfólio de edição de vídeo separado por nicho: games, cassino, motion, saúde, anúncios e vídeos com IA.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAFAF8">
<link rel="icon" type="image/png" href="/portfolio-bruno/icone.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Bruno · Editor de vídeo">
<meta property="og:description" content="Portfólio de edição de vídeo separado por nicho: games, cassino, motion, saúde, anúncios e vídeos com IA.">
<meta property="og:url" content="https://jgcompany.com.br/portfolio-bruno/">
<meta property="og:image" content="https://jgcompany.com.br/portfolio-bruno/previa.png">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<style>:root{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<style>
  /* Portfólio do Bruno para a Workana: só edição de vídeo, estilo galeria (fundo claro, pouco texto).
     Sem nenhum contato (nada de número, e-mail ou @ próprio) e sem marca de agência. */
  :root{
    --bg:#FAFAF8; --txt:#141414; --sub:#6E6E6A; --linha:#E4E4E0; --cartao:#EDEDEA;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:"Inter Tight","Helvetica Neue",Arial,sans-serif;
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
  h1,h2,p{margin:0}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--txt);outline-offset:3px}
  .env{width:min(1280px,100%);margin-inline:auto;padding-inline:32px}
  @media (max-width:640px){.env{padding-inline:16px}}

  /* topo: nome e nichos, fixo */
  .topo{position:sticky;top:0;z-index:10;background:rgba(250,250,248,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
  .topo .env{display:flex;align-items:center;gap:32px;min-height:60px}
  .topo .nome{font-weight:600;flex:none}
  .topo nav{display:flex;gap:24px;overflow-x:auto;scrollbar-width:none;font-size:.94rem;color:var(--sub);margin-left:auto}
  .topo nav::-webkit-scrollbar{display:none}
  .topo nav a{white-space:nowrap;padding-block:18px;border-bottom:1px solid transparent}
  .topo nav a:hover,.topo nav a.on{color:var(--txt)}
  .topo nav a.on{border-color:var(--txt)}
  @media (max-width:860px){
    .topo .env{flex-direction:column;align-items:stretch;gap:0;padding-top:12px}
    .topo nav{margin-left:0;gap:20px}
    .topo nav a{padding-block:12px}
  }

  /* apresentação */
  .eu{display:flex;align-items:center;gap:24px;padding-block:72px 64px}
  .eu img{width:88px;height:88px;border-radius:50%;object-fit:cover;flex:none;display:block}
  .eu h1{font-size:clamp(1.9rem,3.4vw,2.6rem);font-weight:600;letter-spacing:-.025em;line-height:1.1}
  .eu p{margin-top:8px;color:var(--sub);font-size:1.05rem;max-width:52ch}
  @media (max-width:640px){.eu{padding-block:40px 36px;gap:16px}.eu img{width:64px;height:64px}}

  /* nichos */
  .nicho{padding-block:56px 8px;border-top:1px solid var(--linha);scroll-margin-top:60px}
  .nicho .cab{display:flex;align-items:baseline;gap:12px}
  .nicho h2{font-size:1.5rem;font-weight:600;letter-spacing:-.02em}
  .nicho .qtd{color:var(--sub);font-size:.92rem}
  .nicho .desc{margin-top:6px;color:var(--sub);max-width:60ch}
  @media (max-width:860px){.nicho{scroll-margin-top:100px}}
  @media (max-width:640px){.nicho{padding-block:40px 4px}.nicho h2{font-size:1.3rem}}

  .grade{display:grid;gap:28px 16px;margin-top:28px}
  .grade.v{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .grade.h{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  @media (max-width:640px){
    .grade{gap:20px 10px}
    .grade.v{grid-template-columns:1fr 1fr}
    .grade.h{grid-template-columns:1fr}
  }

  .item{display:block;width:100%;border:0;padding:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
  .item .quadro{position:relative;display:block;border-radius:6px;overflow:hidden;background:var(--cartao)}
  .grade.v .quadro{aspect-ratio:9/16}
  .grade.h .quadro{aspect-ratio:16/9}
  .item img,.item video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .item video{opacity:0;transition:opacity .25s}
  .item.tocando video{opacity:1}
  .item .tit{display:block;margin-top:10px;font-size:.92rem;line-height:1.35}

  footer{margin-top:72px;border-top:1px solid var(--linha)}
  footer .env{display:flex;justify-content:space-between;gap:16px;padding-block:24px 40px;color:var(--sub);font-size:.9rem}
  footer a:hover{color:var(--txt)}

  /* lupa */
  dialog.lupa{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;width:100vw;height:100vh;color:#fff}
  dialog.lupa::backdrop{background:rgba(12,12,12,.94)}
  .lupa-in{height:100%;display:grid;grid-template-rows:auto 1fr;gap:12px;padding:16px 20px 24px}
  .lupa .barra{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:.95rem}
  .lupa .barra p{color:#d8d8d4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lupa .bts{display:flex;gap:8px;flex:none}
  .lupa button{border:1px solid #3a3a38;background:transparent;color:#fff;border-radius:4px;padding:8px 12px;font:500 .9rem/1 "Inter Tight",Arial,sans-serif;cursor:pointer}
  .lupa button:hover{border-color:#fff}
  .lupa button[hidden]{display:none}
  .lupa .midia{min-height:0;display:flex;align-items:center;justify-content:center}
  .lupa video,.lupa img{max-width:100%;max-height:100%;display:block;border-radius:4px;background:#000}

  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.item video{transition:none}}
</style>

<header class="topo">
  <div class="env">
    <a class="nome" href="#inicio">Bruno</a>
    <nav id="menu" aria-label="Nichos"></nav>
  </div>
</header>

<main class="env" id="inicio">
  <section class="eu" aria-label="Sobre">
    <img src="foto.jpg" alt="Foto do Bruno">
    <div>
      <h1>Bruno, editor de vídeo</h1>
      <p>Edito Shorts, vídeos de YouTube, motion e anúncios para criadores e marcas, no Brasil e lá fora.</p>
    </div>
  </section>
  <div id="nichos"></div>
</main>

<footer>
  <div class="env">
    <span>Bruno · Editor de vídeo</span>
    <a href="#inicio">Voltar ao topo</a>
  </div>
</footer>

<dialog class="lupa" id="lupa" aria-label="Vídeo">
  <div class="lupa-in">
    <div class="barra">
      <p id="lupa-txt"></p>
      <div class="bts">
        <button type="button" id="lupa-ant" aria-label="Anterior">←</button>
        <button type="button" id="lupa-prox" aria-label="Próximo">→</button>
        <button type="button" id="lupa-fechar">Fechar</button>
      </div>
    </div>
    <div class="midia" id="lupa-midia"></div>
  </div>
</dialog>

<script>
(function(){
  "use strict";
  var calmo = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var toque = window.matchMedia && matchMedia("(hover: none)").matches;

  // Cada nicho: id, nome, uma frase e os trabalhos [arquivo, formato v/h, título, "img" se for thumbnail].
  // Os "cassino-" ficam em media/ desta página (inteiros, sem corte); o resto vem de /media/ do site principal.
  var NICHOS = [
    ["games", "Games", "Shorts e vídeos longos de Roblox e Minecraft para youtubers dos EUA. Também faço as thumbnails.", [
      ["games-7","v","Short de Roblox com ritmo acelerado"],
      ["games-8","v","Short de Roblox com história"],
      ["games-6","v","Short de Minecraft com legenda"],
      ["games-5","v","Short de Minecraft com legenda colorida"],
      ["games-3","h","Vídeo longo de Roblox"],
      ["games-1","h","Vídeo longo de Minecraft com efeitos"],
      ["games-4","h","Roblox com desafio e placar na tela"],
      ["games-2","h","Minecraft com facecam"],
      ["thumb-roblox-1","h","Thumbnail de Roblox","img"],
      ["thumb-mine-1","h","Thumbnail de Minecraft","img"],
      ["thumb-roblox-2","h","Thumbnail de Roblox","img"],
      ["thumb-mine-2","h","Thumbnail de Minecraft","img"]]],
    ["cassino", "Cassino e slots", "Cortes de live de slot para streamers internacionais, com a reação deles e legenda.", [
      ["cassino-pray-for-six","v","Big win com reação dos streamers"],
      ["cassino-madame-destiny","v","Big win no ritmo da rodada"],
      ["cassino-duck-hunters","v","Rodada bônus até o fim"]]],
    ["motion", "Motion design", "Texto, número e gráfico animados junto com a fala.", [
      ["motions-br-2","v","Motion que explica a ideia"],
      ["motions-en-2","v","Legenda animada para criador americano"],
      ["saas-1","v","App de empréstimos em motion"],
      ["motions-br-3","h","Número que ganha vida na tela"],
      ["motions-en-1","h","Gráficos para youtuber americano"],
      ["motions-en-3","h","Motion para criador americano"],
      ["saas-2","h","Sistema explicado em animação"]]],
    ["saude", "Saúde", "Vídeos curtos para pediatras, com legenda e imagem de apoio.", [
      ["pediatras-3","v","Dica de pediatra"],
      ["pediatras-6","v","Três dicas sobre o quarto do bebê"],
      ["pediatras-5","v","Leite fraco ou insuficiente?"],
      ["pediatras-2","v","Texto que reforça a fala"],
      ["pediatras-1","v","Palavra-chave em destaque"],
      ["pediatras-4","v","Desmame explicado"]]],
    ["empresas", "Empresas e anúncios", "Criativos para anúncio e vídeos institucionais.", [
      ["motions-br-4","v","Anúncio para loja de celulares"],
      ["motions-br-5","v","Anúncio para comunicação visual"],
      ["motions-br-1","v","Criativo com motion para anúncio"],
      ["corporativos-2","h","Institucional sobre tabagismo"],
      ["corporativos-1","h","Institucional com destaque na tela"]]],
    ["ia", "Vídeos com IA", "Animações e cenas realistas feitas com IA para anúncios.", [
      ["ia-animacao-3","v","Animação para seguro escolar"],
      ["ia-realista-1","v","Atores realistas para anúncio nos EUA"],
      ["ia-animacao-1","v","Animação para anúncio em espanhol"],
      ["ia-animacao-2","v","Personagens para app americano"],
      ["ia-realista-2","v","História realista para anúncio em inglês"],
      ["ia-3d","h","Luta 3D estilo videogame"]]]
  ];
  function caminho(id){ return (id.indexOf("cassino-") === 0 ? "media/" : "../media/") + id; }

  // ---------- monta menu e grades ----------
  var menu = document.getElementById("menu"), caixa = document.getElementById("nichos");
  NICHOS.forEach(function(n){
    var a = document.createElement("a"); a.href = "#" + n[0]; a.textContent = n[1]; menu.appendChild(a);
    var sec = document.createElement("section"); sec.className = "nicho"; sec.id = n[0];
    sec.innerHTML = '<div class="cab"><h2></h2><span class="qtd"></span></div><p class="desc"></p>';
    sec.querySelector("h2").textContent = n[1];
    sec.querySelector(".qtd").textContent = n[3].length + (n[3].length === 1 ? " trabalho" : " trabalhos");
    sec.querySelector(".desc").textContent = n[2];
    var lista = [];
    ["v", "h"].forEach(function(f){
      var itens = n[3].filter(function(t){ return t[1] === f; });
      if(!itens.length) return;
      var g = document.createElement("div"); g.className = "grade " + f;
      itens.forEach(function(t){
        var img = t[3] === "img", b = document.createElement("button");
        b.type = "button"; b.className = "item";
        b.innerHTML = '<span class="quadro"><img loading="lazy" decoding="async" alt="">' +
          (img ? "" : '<video muted loop playsinline preload="none"></video>') + '</span><span class="tit"></span>';
        b.querySelector("img").src = caminho(t[0]) + ".jpg";
        b.querySelector("img").alt = t[2];
        b.querySelector(".tit").textContent = t[2];
        var item = {src: caminho(t[0]) + (img ? ".jpg" : ".mp4"), img: img, leg: n[1] + " · " + t[2], lista: lista, i: lista.length};
        lista.push(item);
        b.addEventListener("click", function(){ abrir(item); });
        if(!img && !toque && !calmo){
          var v = b.querySelector("video");
          b.addEventListener("mouseenter", function(){
            if(!v.getAttribute("src")) v.src = item.src;
            var p = v.play(); if(p && p.catch) p.catch(function(){});
            b.classList.add("tocando");
          });
          b.addEventListener("mouseleave", function(){ v.pause(); b.classList.remove("tocando"); });
        }
        g.appendChild(b);
      });
      sec.appendChild(g);
    });
    caixa.appendChild(sec);
  });

  // ---------- menu marca o nicho que está na tela ----------
  if("IntersectionObserver" in window){
    var links = [].slice.call(menu.querySelectorAll("a"));
    var obs = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(!e.isIntersecting) return;
        links.forEach(function(a){
          var on = a.getAttribute("href") === "#" + e.target.id;
          a.classList.toggle("on", on);
          if(on && menu.scrollWidth > menu.clientWidth) menu.scrollTo({left: a.offsetLeft - menu.offsetLeft - 16, behavior: "smooth"});
        });
      });
    }, {rootMargin: "-45% 0px -50% 0px"});
    [].slice.call(document.querySelectorAll(".nicho")).forEach(function(s){ obs.observe(s); });
  }

  // ---------- lupa: abre com som, setas passam dentro do mesmo nicho ----------
  var lupa = document.getElementById("lupa"), area = document.getElementById("lupa-midia"), txt = document.getElementById("lupa-txt"), atual = null;
  var ant = document.getElementById("lupa-ant"), prox = document.getElementById("lupa-prox");
  function abrir(item){
    atual = item; area.innerHTML = "";
    var el;
    if(item.img){ el = document.createElement("img"); el.alt = item.leg; }
    else { el = document.createElement("video"); el.controls = true; el.autoplay = true; el.playsInline = true; }
    el.src = item.src; area.appendChild(el); txt.textContent = item.leg;
    ant.hidden = prox.hidden = item.lista.length < 2;
    if(!lupa.open && lupa.showModal) lupa.showModal();
  }
  function passar(d){ if(atual) abrir(atual.lista[(atual.i + d + atual.lista.length) % atual.lista.length]); }
  ant.addEventListener("click", function(){ passar(-1); });
  prox.addEventListener("click", function(){ passar(1); });
  document.getElementById("lupa-fechar").addEventListener("click", function(){ lupa.close(); });
  lupa.addEventListener("click", function(e){ if(e.target === lupa || e.target === area) lupa.close(); });
  lupa.addEventListener("keydown", function(e){
    if(e.key === "ArrowRight"){ e.preventDefault(); passar(1); }
    if(e.key === "ArrowLeft"){ e.preventDefault(); passar(-1); }
  });
  lupa.addEventListener("close", function(){ area.innerHTML = ""; atual = null; });
})();
</script>

</body>
</html>
